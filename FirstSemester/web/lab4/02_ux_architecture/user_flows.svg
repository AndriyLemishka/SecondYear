<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .header-title { font-family: 'Inter', sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; }
      .header-subtitle { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 400; fill: #64748B; }
      .flow-card { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1.5; rx: 16px; }
      .flow-title { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .flow-tag { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; fill: #005EC9; }
      .flow-tag-bg { fill: #EFF6FF; rx: 6px; }
      .node-box { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; rx: 10px; }
      .node-text { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; fill: #1E293B; text-anchor: middle; }
      .node-sub { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 400; fill: #64748B; text-anchor: middle; }
      .node-active { fill: #005EC9; stroke: #005EC9; }
      .node-active-text { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; fill: #FFFFFF; text-anchor: middle; }
      .node-success { fill: #ECFDF5; stroke: #10B981; stroke-width: 2; rx: 10px; }
      .node-success-text { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700; fill: #065F46; text-anchor: middle; }
      .arrow { stroke: #94A3B8; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .badge-gen { fill: #FEF3C7; stroke: #F59E0B; rx: 4px; }
      .badge-gen-text { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; fill: #92400E; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94A3B8" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1440" height="900" class="bg" />

  <!-- Top Title Bar -->
  <rect x="40" y="30" width="1360" height="80" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
  <circle cx="80" cy="70" r="22" fill="#005EC9" />
  <path d="M78 60 L86 69 L80 69 L82 80 L74 71 L80 71 Z" fill="#FFFFFF" />
  <text x="120" y="65" class="header-title">01 — Шляхи Користувача (User Flows) • ChargeUA</text>
  <text x="120" y="88" class="header-subtitle">3 критично важливі сценарії взаємодії водія із системою агрегації та інтерактивними помічниками</text>

  <!-- ==================== FLOW 1 ==================== -->
  <g transform="translate(40, 130)">
    <rect width="1360" height="230" class="flow-card" />
    <rect x="24" y="20" width="90" height="26" class="flow-tag-bg" />
    <text x="32" y="38" class="flow-tag">СЦЕНАРІЙ 1</text>
    <text x="124" y="38" class="flow-title">Екстрений пошук вільної зарядної станції під час блекауту (Комерційні водії / SOS)</text>

    <!-- Nodes -->
    <!-- Node 1 -->
    <rect x="40" y="75" width="200" height="65" class="node-box" />
    <text x="140" y="103" class="node-text">Головна сторінка</text>
    <text x="140" y="123" class="node-sub">Hero-екран ChargeUA</text>

    <!-- Arrow 1-2 -->
    <path d="M240 107 L285 107" class="arrow" />

    <!-- Node 2 -->
    <rect x="290" y="75" width="220" height="65" class="node-box" />
    <text x="400" y="100" class="node-text">Клік 'Знайти зарядку'</text>
    <text x="400" y="120" class="node-sub">+ Фільтр '🔋 З генератором'</text>

    <!-- Arrow 2-3 -->
    <path d="M510 107 L555 107" class="arrow" />

    <!-- Node 3 -->
    <rect x="560" y="75" width="230" height="65" class="node-box" />
    <text x="675" y="100" class="node-text">Інтерактивна Карта</text>
    <text x="675" y="120" class="node-sub">Кластеризація online-станцій</text>

    <!-- Arrow 3-4 -->
    <path d="M790 107 L835 107" class="arrow" />

    <!-- Node 4 -->
    <rect x="840" y="75" width="220" height="65" class="node-box" />
    <text x="950" y="100" class="node-text">Вибір вільного порту</text>
    <text x="950" y="120" class="node-sub">CCS2 120 кВт (Status: Free)</text>

    <!-- Arrow 4-5 -->
    <path d="M1060 107 L1105 107" class="arrow" />

    <!-- Node 5 (Success) -->
    <rect x="1110" y="75" width="210" height="65" class="node-success" />
    <text x="1215" y="100" class="node-success-text">Маршрут у навігатор</text>
    <text x="1215" y="120" class="node-sub">Google Maps / Waze (Успіх)</text>

    <!-- Error/Recovery path below -->
    <path d="M950 140 L950 175 L675 175 L675 140" class="arrow" stroke-dasharray="4" />
    <text x="812" y="195" font-family="Inter" font-size="11" fill="#DC2626" font-weight="600" text-anchor="middle">⚠️ Якщо порт зайнято: авто-пропозиція альтернативи поруч (850 м)</text>
  </g>

  <!-- ==================== FLOW 2 ==================== -->
  <g transform="translate(40, 380)">
    <rect width="1360" height="230" class="flow-card" />
    <rect x="24" y="20" width="90" height="26" class="flow-tag-bg" />
    <text x="32" y="38" class="flow-tag">СЦЕНАРІЙ 2</text>
    <text x="124" y="38" class="flow-title">Розрахунок вартості підзарядки та порівняння тарифів операторів (Міські водії)</text>

    <!-- Node 1 -->
    <rect x="40" y="75" width="200" height="65" class="node-box" />
    <text x="140" y="100" class="node-text">Клік 'Розрахувати'</text>
    <text x="140" y="120" class="node-sub">Скрол до Калькулятора</text>

    <!-- Arrow 1-2 -->
    <path d="M240 107 L285 107" class="arrow" />

    <!-- Node 2 -->
    <rect x="290" y="75" width="220" height="65" class="node-box" />
    <text x="400" y="100" class="node-text">Вибір моделі авто</text>
    <text x="400" y="120" class="node-sub">Напр., VW ID.4 (77 кВт·год)</text>

    <!-- Arrow 2-3 -->
    <path d="M510 107 L555 107" class="arrow" />

    <!-- Node 3 -->
    <rect x="560" y="75" width="230" height="65" class="node-box" />
    <text x="675" y="100" class="node-text">Подвійний повзунок %</text>
    <text x="675" y="120" class="node-sub">Діапазон 20% → 80% (46.2 кВт·год)</text>

    <!-- Arrow 3-4 -->
    <path d="M790 107 L835 107" class="arrow" />

    <!-- Node 4 -->
    <rect x="840" y="75" width="220" height="65" class="node-box" />
    <text x="950" y="100" class="node-text">Матриця тарифів</text>
    <text x="950" y="120" class="node-sub">EcoFactor vs Yasno vs TOKA</text>

    <!-- Arrow 4-5 -->
    <path d="M1060 107 L1105 107" class="arrow" />

    <!-- Node 5 (Success) -->
    <rect x="1110" y="75" width="210" height="65" class="node-success" />
    <text x="1215" y="100" class="node-success-text">Фільтр станцій мережі</text>
    <text x="1215" y="120" class="node-sub">Показ за найкращою ціною</text>

    <!-- Error/Recovery path below -->
    <path d="M675 140 L675 175 L400 175 L400 140" class="arrow" stroke-dasharray="4" />
    <text x="537" y="195" font-family="Inter" font-size="11" fill="#D97706" font-weight="600" text-anchor="middle">⚠️ Захист від помилки: блокування перетину повзунків (min &lt; max)</text>
  </g>

  <!-- ==================== FLOW 3 ==================== -->
  <g transform="translate(40, 630)">
    <rect width="1360" height="230" class="flow-card" />
    <rect x="24" y="20" width="90" height="26" class="flow-tag-bg" />
    <text x="32" y="38" class="flow-tag">СЦЕНАРІЙ 3</text>
    <text x="124" y="38" class="flow-title">Онбординг новачка: підбір конектора та інструкція безпеки (Перша публічна зарядка)</text>

    <!-- Node 1 -->
    <rect x="40" y="75" width="200" height="65" class="node-box" />
    <text x="140" y="100" class="node-text">Блок 'Як це працює'</text>
    <text x="140" y="120" class="node-sub">Покроковий гайд</text>

    <!-- Arrow 1-2 -->
    <path d="M240 107 L285 107" class="arrow" />

    <!-- Node 2 -->
    <rect x="290" y="75" width="220" height="65" class="node-box" />
    <text x="400" y="100" class="node-text">Вибір типу порту</text>
    <text x="400" y="120" class="node-sub">CCS2 / Type 2 / GB/T / CHAdeMO</text>

    <!-- Arrow 2-3 -->
    <path d="M510 107 L555 107" class="arrow" />

    <!-- Node 3 -->
    <rect x="560" y="75" width="230" height="65" class="node-box" />
    <text x="675" y="100" class="node-text">Інструкція з підключення</text>
    <text x="675" y="120" class="node-sub">Фіксація замка → старт сесії</text>

    <!-- Arrow 3-4 -->
    <path d="M790 107 L835 107" class="arrow" />

    <!-- Node 4 -->
    <rect x="840" y="75" width="220" height="65" class="node-box" />
    <text x="950" y="100" class="node-text">Клік 'Шукати станції'</text>
    <text x="950" y="120" class="node-sub">Перехід до карти з роз'ємом</text>

    <!-- Arrow 4-5 -->
    <path d="M1060 107 L1105 107" class="arrow" />

    <!-- Node 5 (Success) -->
    <rect x="1110" y="75" width="210" height="65" class="node-success" />
    <text x="1215" y="100" class="node-success-text">Впевнена перша сесія</text>
    <text x="1215" y="120" class="node-sub">Повний контроль зарядки</text>

    <!-- Error/Recovery path below -->
    <path d="M400 140 L400 175 L140 175 L140 140" class="arrow" stroke-dasharray="4" />
    <text x="270" y="195" font-family="Inter" font-size="11" fill="#2563EB" font-weight="600" text-anchor="middle">💡 Не знаєте свій порт? Швидкий підбір за країною походження авто</text>
  </g>
</svg>
